<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>1325.AI is loading</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #07111f;
        --muted: #475569;
        --gold: #ffb300;
        --blue: #003366;
        --line: #d8b84d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: var(--ink);
      }

      main {
        width: min(100%, 440px);
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border: 2px solid var(--line);
        border-radius: 18px;
        color: var(--blue);
        font-size: 28px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0 auto 22px;
        max-width: 34ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      button,
      a {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      button {
        background: var(--blue);
        color: #ffffff;
      }

      a {
        margin-top: 10px;
        color: var(--blue);
        border: 1px solid #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">13</div>
      <h1>1325.AI is having trouble loading</h1>
      <p>Please check your internet connection, then try again. This screen prevents the app from getting stuck on black.</p>
      <button type="button" onclick="window.location.href='https://1325.ai'">Try again</button>
      <a href="https://1325.ai/support">Contact support</a>
    </main>
  </body>
</html>
